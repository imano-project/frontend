default_permissions = "imano"

[permissions.imano]
extends = ":workspace"

[permissions.imano.filesystem]
# macOS enforces these globs at every depth; this bounds scans on other platforms.
glob_scan_max_depth = 6

[permissions.imano.filesystem.":workspace_roots"]
"**/.env" = "deny"
"**/.env.*" = "deny"
"**/*.xcconfig" = "deny"
"**/GoogleService-Info.plist" = "deny"
"**/*.p8" = "deny"
"**/*.p12" = "deny"
"**/*.mobileprovision" = "deny"
